# =========================================
# Telegraf main agent settings
# =========================================
[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "0s"
  hostname = ""            # Telegraf container hostname
  omit_hostname = false    # Required for scalars to have _host tag

# =========================================
# Output: InfluxDB v2
# =========================================
[[outputs.influxdb_v2]]
  urls = [ "http://influxdb:8086" ]
  token = "49d5b7da158578dc800e8eacf15321df"
  organization = "MyOrg"
  bucket = "oneos_snmp"

# =========================================
# INPUT: SNMP - OneOS (OneAccess)
# =========================================

[[inputs.snmp]]
  agents = [ "udp://192.168.56.107:161"
             ]
  version = 2
  community = "public"
  timeout = "2s"
  retries = 1
  name = "interface"

 [[inputs.snmp.field]]
    name = "hostname"
    oid = "SNMPv2-MIB::sysName.0"
    is_tag = true
 
 [[inputs.snmp.table]]
    name = "cpu"
    inherit_tags = [ "hostname" ]
    oid = "ONEACCESS-SYS-MIB::oacSysCpuUsedCoresTable"

 [[inputs.snmp.field]]
    name = "memFree"
    oid = "ONEACCESS-SYS-MIB::oacSysMemoryFree.0"
 [[inputs.snmp.field]]
    name = "memTotal"
    oid = "ONEACCESS-SYS-MIB::oacSysMemoryTotal.0"

 [[inputs.snmp.field]]
    name = "uptime"
    oid = "1.3.6.1.2.1.1.3.0"
 
 [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = [ "hostname" ]
    oid = "IF-MIB::ifXTable"
 [[inputs.snmp.table.field]]
    name = "ifName"
    oid = "IF-MIB::ifName"
    is_tag = true

 [[inputs.snmp.table]]
    name = "cellular"
    inherit_tags = [ "hostname" ]
    oid = "1.3.6.1.4.1.13191.10.3.9.2"

